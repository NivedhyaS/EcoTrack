<script>
document.addEventListener("DOMContentLoaded", function () {

    let carbon = localStorage.getItem("carbonValue");

    const valueEl = document.getElementById("value");
    const statusEl = document.getElementById("status");
    const tipEl = document.getElementById("tip");

    if (!valueEl || !statusEl || !tipEl) {
        console.error("Required elements not found in HTML");
        return;
    }

    if (carbon === null) {
        valueEl.innerText = "No data available";
        statusEl.innerText = "";
        tipEl.innerText = "Please calculate your carbon footprint first.";
    } 
    else {
        carbon = parseFloat(carbon);

        valueEl.innerText = carbon + " kg CO₂/day";

        if (carbon < 5) {
            statusEl.innerText = "Status: Low Emission";
            statusEl.className = "low";
            tipEl.innerText = "Great job! Keep using eco-friendly habits.";
        } 
        else if (carbon < 10) {
            statusEl.innerText = "Status: Moderate Emission";
            statusEl.className = "moderate";
            tipEl.innerText = "Reduce electricity use and prefer public transport.";
        } 
        else {
            statusEl.innerText = "Status: High Emission";
            statusEl.className = "high";
            tipEl.innerText = "Urgently reduce energy usage and private vehicle travel.";
        }
    }

});

function recalculate() {
    window.location.href = "calculator.html";
}
</script>
