<script>
let carbon = localStorage.getItem("carbonValue");

// If no calculation done yet
if (carbon === null) {
    document.getElementById("value").innerText = "No data available";
    document.getElementById("status").innerText = "";
    document.getElementById("tip").innerText =
        "Please calculate your carbon footprint first.";
} 
else {
    carbon = parseFloat(carbon);

    document.getElementById("value").innerText =
        carbon + " kg CO₂/day";

    if (carbon < 5) {
        document.getElementById("status").innerText =
            "Status: Low Emission";
        document.getElementById("status").className = "low";
        document.getElementById("tip").innerText =
            "Great job! Keep using eco-friendly habits.";
    } 
    else if (carbon < 10) {
        document.getElementById("status").innerText =
            "Status: Moderate Emission";
        document.getElementById("status").className = "moderate";
        document.getElementById("tip").innerText =
            "Reduce electricity use and prefer public transport.";
    } 
    else {
        document.getElementById("status").innerText =
            "Status: High Emission";
        document.getElementById("status").className = "high";
        document.getElementById("tip").innerText =
            "Urgently reduce energy usage and private vehicle travel.";
    }
}

function recalculate() {
    window.location.href = "calculator.html";
}
</script>
