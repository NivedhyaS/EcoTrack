<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | EcoTrack</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef7ee;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: white;
    width: 380px;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 15px #bbb;
}

.low { color: green; }
.moderate { color: orange; }
.high { color: red; }

button {
    padding: 10px 18px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">
    <h2>EcoTrack Dashboard 🌱</h2>

    <p id="value"></p>
    <p id="status"></p>
    <p id="tip"></p>

    <button onclick="recalculate()">Recalculate</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    let carbon = localStorage.getItem("carbonValue");

    const valueEl = document.getElementById("value");
    const statusEl = document.getElementById("status");
    const tipEl = document.getElementById("tip");

    if (carbon === null) {
        valueEl.innerText = "No data available";
        statusEl.innerText = "";
        tipEl.innerText = "Please calculate your carbon footprint first.";
        return;
    }

    carbon = parseFloat(carbon);
    valueEl.innerText = carbon + " kg CO₂/day";

    if (carbon < 5) {
        statusEl.innerText = "Status: Low Emission";
        statusEl.className = "low";
        tipEl.innerText = "Great job! Keep using eco-friendly habits.";
    } else if (carbon < 10) {
        statusEl.innerText = "Status: Moderate Emission";
        statusEl.className = "moderate";
        tipEl.innerText = "Reduce electricity use and prefer public transport.";
    } else {
        statusEl.innerText = "Status: High Emission";
        statusEl.className = "high";
        tipEl.innerText = "Urgently reduce energy usage and private vehicle travel.";
    }
});

function recalculate() {
    window.location.href = "calculator.html";
}
</script>

</body>
</html>
